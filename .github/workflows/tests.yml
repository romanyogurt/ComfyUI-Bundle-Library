# The unit tests, on every push to main and every pull request: Python on
# Ubuntu, Windows and macOS (on Ubuntu also the oldest and newest Python), and
# the JS tests once. The end-to-end and browser suites need a ComfyUI;
# tests/test-server.sh runs them (CONTRIBUTING.md).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install what the tests import (ComfyUI installs these too)
        run: python -m pip install aiohttp pillow av numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -t .

  js:
    name: JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests
        run: node --test "tests/js/*.test.mjs"
