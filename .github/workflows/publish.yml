# Publishes the pack to the Comfy Registry, which ComfyUI-Manager and comfy-cli install from, when a GitHub release
# is published (its notes become the Registry's changelog of the version), or when run by hand. The version is the
# one in pyproject.toml. REGISTRY_ACCESS_TOKEN is an API key of the publisher (PublisherId there). comfy-cli is pinned
# to the version the package was checked with (comfy node validate, pack).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the Comfy Registry
    if: github.repository == 'romanyogurt/ComfyUI-Bundle-Library'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install comfy-cli
        run: python -m pip install comfy-cli==1.22.0
      - name: Publish
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          COMFY_NODE_CHANGELOG: ${{ github.event.release.body }}
        run: comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
