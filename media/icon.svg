<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- The pack's icon: a bundle (a box) whose contents leave it as typed outputs. icon.png is this,
       rendered at 400×400 (the Registry's largest icon). -->
